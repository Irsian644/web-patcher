<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Per-page <title>/meta/OG/Twitter/canonical/JSON-LD are injected per
         route by src/seo/Seo.jsx and prerendered into static HTML. The line
         below is only a no-JS fallback for any non-prerendered request. -->
    <meta name="theme-color" content="#050816" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Resource hints: fonts + Instagram (where outbound links go) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="dns-prefetch" href="https://ig.me" />
    <link rel="dns-prefetch" href="https://instagram.com" />

    <!-- Clash Display (Fontshare) for cinematic headlines -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap"
    />

    <!-- Preload critical fonts + the LCP hero screenshot -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />
    <link rel="preload" as="image" href="/work/duo-nails.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
